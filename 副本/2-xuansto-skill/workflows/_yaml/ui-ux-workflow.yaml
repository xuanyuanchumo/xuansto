metadata:
  name: UI/UX设计专项工作流
  version: "1.9.1"
  description: UI/UX设计专项与前端实现工作流
  platform: all
  min_agents: 2
  max_agents: 5
phases:
  - id: phase-0
    name: UX/UI设计
    order: 0
    optional: false
    trigger_condition: 用户请求UI/UX设计或界面优化
    agents:
      primary: [ux-designer, ui-designer]
      supporting: [product-manager, desktop-ui-adapter]
    inputs:
      - name: 产品需求
        type: document
        required: true
      - name: 用户画像
        type: document
        required: true
      - name: 业务目标
        type: document
        required: true
    outputs:
      - name: 用户研究报告
        type: document
        validation: 用户画像清晰且痛点已识别
      - name: 高保真设计稿
        type: document
        validation: 设计评审通过
      - name: 设计系统文档
        type: document
        validation: 组件可复用
      - name: 桌面窗口布局规范
        type: document
        validation: 窗口尺寸适配方案完整
      - name: 系统菜单结构图
        type: document
        validation: 菜单结构符合各平台规范
    quality_gates:
      - gate_id: design_review
        blocking: true
        pass_criteria: 设计评审通过且符合品牌规范
      - gate_id: accessibility_check
        blocking: true
        pass_criteria: 可访问性无A级违规
    timeout_minutes: 120
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-4
    name: TDD开发与代码审查
    order: 1
    optional: false
    trigger_condition: UX/UI设计完成
    agents:
      primary: [frontend-stylist, frontend-developer]
      supporting: []
    inputs:
      - name: 最终设计稿
        type: document
        required: true
        source_phase: phase-0
      - name: 设计规范文档
        type: document
        required: true
        source_phase: phase-0
      - name: 切图资源
        type: artifact
        required: true
    outputs:
      - name: 样式代码
        type: code
        validation: 还原度>=95%
      - name: UI组件库
        type: code
        validation: 响应式适配完成
      - name: 响应式页面
        type: code
        validation: 动效流畅
    quality_gates:
      - gate_id: restoration_95
        blocking: true
        pass_criteria: 还原度>=95%
      - gate_id: responsive_done
        blocking: true
        pass_criteria: 响应式适配完成
      - gate_id: animation_smooth
        blocking: false
        pass_criteria: 动效流畅
    timeout_minutes: 120
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-5
    name: 验证
    order: 2
    optional: false
    trigger_condition: 前端实现完成
    agents:
      primary: [ux-designer, e2e-tester]
      supporting: []
    inputs:
      - name: 实现的界面
        type: code
        required: true
        source_phase: phase-4
      - name: 测试用户
        type: document
        required: false
    outputs:
      - name: 可用性测试报告
        type: document
        validation: 任务完成率>=80%
      - name: 优化建议清单
        type: document
      - name: 迭代版本
        type: code
    quality_gates:
      - gate_id: task_completion_80
        blocking: true
        pass_criteria: 任务完成率>=80%
      - gate_id: satisfaction_4
        blocking: true
        pass_criteria: 用户满意度>=4/5
      - gate_id: key_issues_fixed
        blocking: true
        pass_criteria: 关键问题已修复
    timeout_minutes: 60
    retry:
      max_attempts: 2
      backoff: fixed
agent_matrix:
  ux-designer:
    phases: [phase-0, phase-5]
    role: primary
    max_parallel_instances: 1
  ui-designer:
    phases: [phase-0]
    role: primary
    max_parallel_instances: 1
  frontend-stylist:
    phases: [phase-4]
    role: primary
    max_parallel_instances: 1
  frontend-developer:
    phases: [phase-4]
    role: primary
    max_parallel_instances: 1
  e2e-tester:
    phases: [phase-5]
    role: primary
    max_parallel_instances: 1
exception_handling:
  phase_failure:
    action: retry_then_escalate
    escalation_target: orchestrator
    max_retries: 3
  agent_unavailable:
    action: substitute_and_continue
    substitute_agent: frontend-developer
  quality_gate_blocked:
    action: auto_fix_then_pause
    auto_fix_agents: [frontend-stylist, frontend-developer]
