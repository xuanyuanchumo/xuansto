metadata:
  name: Flutter桌面应用开发工作流
  version: "1.9.1"
  description: Flutter桌面应用全生命周期开发工作流
  platform: desktop
  min_agents: 3
  max_agents: 8
phases:
  - id: phase-1
    name: 设计
    order: 1
    optional: false
    trigger_condition: Flutter桌面项目需求确认
    agents:
      primary: [desktop-developer, desktop-ui-adapter, product-manager]
      supporting: []
    inputs:
      - name: 项目需求文档
        type: document
        required: true
      - name: 技术栈约束
        type: document
        required: true
      - name: 目标平台列表
        type: document
        required: true
    outputs:
      - name: Flutter桌面架构设计文档
        type: document
        validation: 架构设计已确认
      - name: Platform Channel契约文档
        type: document
        validation: Platform Channel契约已定义
      - name: 跨平台差异矩阵
        type: document
        validation: 平台差异已识别并记录
      - name: 插件兼容性评估报告
        type: document
        validation: 插件兼容性已评估
    quality_gates:
      - gate_id: flutter_design_approved
        blocking: true
        pass_criteria: Flutter桌面UI/UX设计通过评审
      - gate_id: platform_matrix_defined
        blocking: true
        pass_criteria: 跨平台差异矩阵已定义
      - gate_id: ipc_contract_defined
        blocking: true
        pass_criteria: Platform Channel契约已定义
    timeout_minutes: 90
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-2
    name: 开发
    order: 2
    optional: false
    trigger_condition: 设计评审通过
    agents:
      primary: [desktop-developer, desktop-ui-adapter, native-module-developer]
      supporting: []
    inputs:
      - name: 架构设计文档
        type: document
        required: true
        source_phase: phase-1
      - name: Platform Channel契约文档
        type: document
        required: true
        source_phase: phase-1
      - name: 跨平台差异矩阵
        type: document
        required: true
        source_phase: phase-1
      - name: 插件兼容性评估报告
        type: document
        required: true
        source_phase: phase-1
    outputs:
      - name: Flutter业务代码与测试
        type: code
        validation: 核心功能实现完成且测试通过
      - name: Platform Channel实现代码
        type: code
        validation: 三平台Platform Channel实现完成
      - name: 原生插件代码
        type: code
        validation: 原生插件桌面平台实现完成
      - name: 窗口管理模块
        type: code
        validation: 窗口管理功能实现完成
      - name: 桌面交互模块
        type: code
        validation: 桌面交互功能实现完成
    quality_gates:
      - gate_id: flutter_code_review
        blocking: true
        pass_criteria: 代码审查通过
      - gate_id: platform_channel_tested
        blocking: true
        pass_criteria: Platform Channel单元测试通过
      - gate_id: plugin_compat_verified
        blocking: true
        pass_criteria: 插件桌面平台兼容性验证通过
    timeout_minutes: 300
    retry:
      max_attempts: 3
      backoff: exponential
  - id: phase-3
    name: 测试
    order: 3
    optional: false
    trigger_condition: 开发阶段完成
    agents:
      primary: [desktop-tester, desktop-developer]
      supporting: [desktop-ui-adapter]
    inputs:
      - name: Flutter应用代码
        type: code
        required: true
        source_phase: phase-2
      - name: Platform Channel实现
        type: code
        required: true
        source_phase: phase-2
      - name: 测试用例集
        type: document
        required: true
      - name: 跨平台差异矩阵
        type: document
        required: true
        source_phase: phase-1
    outputs:
      - name: 测试覆盖率报告
        type: document
        validation: 测试覆盖率>=80%
      - name: 跨平台测试报告
        type: document
        validation: 三平台功能一致性验证通过
      - name: 性能基准报告
        type: document
        validation: 性能指标达标
      - name: 构建验证报告
        type: document
        validation: 所有目标平台构建成功
    quality_gates:
      - gate_id: desktop_build
        blocking: true
        pass_criteria: DESKTOP-BUILD所有目标平台构建成功
      - gate_id: desktop_cross
        blocking: true
        pass_criteria: DESKTOP-CROSS跨平台测试通过
      - gate_id: ipc_contract
        blocking: true
        pass_criteria: IPC-CONTRACT平台通道契约验证通过
    timeout_minutes: 180
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-4
    name: 构建
    order: 4
    optional: false
    trigger_condition: 测试阶段通过
    agents:
      primary: [build-release-engineer, desktop-developer]
      supporting: [native-module-developer]
    inputs:
      - name: 测试通过的代码
        type: code
        required: true
        source_phase: phase-3
      - name: 构建配置文件
        type: document
        required: true
      - name: 签名证书与密钥
        type: secret
        required: true
    outputs:
      - name: 各平台安装包
        type: artifact
        validation: 所有目标平台安装包生成成功
      - name: 已签名的安装包
        type: artifact
        validation: 所有平台签名验证通过
      - name: 签名验证报告
        type: document
      - name: 更新清单文件
        type: document
        validation: 更新清单格式正确
    quality_gates:
      - gate_id: desktop_sign
        blocking: true
        pass_criteria: DESKTOP-SIGN所有平台签名验证通过
      - gate_id: desktop_update
        blocking: true
        pass_criteria: DESKTOP-UPDATE自动更新配置验证通过
    timeout_minutes: 240
    retry:
      max_attempts: 2
      backoff: exponential
  - id: phase-5
    name: 发布
    order: 5
    optional: false
    trigger_condition: 构建与签名验证通过
    agents:
      primary: [build-release-engineer, desktop-developer]
      supporting: [product-manager]
    inputs:
      - name: 已签名的安装包
        type: artifact
        required: true
        source_phase: phase-4
      - name: 更新清单文件
        type: document
        required: true
        source_phase: phase-4
      - name: 分发配置
        type: document
        required: true
    outputs:
      - name: 安装验证报告
        type: document
        validation: 各平台安装卸载正常
      - name: 自动更新验证报告
        type: document
        validation: 自动更新流程验证通过
      - name: Release Notes
        type: document
        validation: 发布文档完整
      - name: 发布通知记录
        type: document
    quality_gates:
      - gate_id: install_uninstall_pass
        blocking: true
        pass_criteria: 各平台安装卸载正常
      - gate_id: auto_update_verified
        blocking: true
        pass_criteria: 自动更新流程验证通过
      - gate_id: release_docs_complete
        blocking: true
        pass_criteria: 发布文档完整
    timeout_minutes: 120
    retry:
      max_attempts: 2
      backoff: fixed
agent_matrix:
  desktop-developer:
    phases: [phase-1, phase-2, phase-3, phase-4, phase-5]
    role: primary
    max_parallel_instances: 1
  desktop-ui-adapter:
    phases: [phase-1, phase-2, phase-3]
    role: primary
    max_parallel_instances: 1
  native-module-developer:
    phases: [phase-2, phase-4]
    role: primary
    max_parallel_instances: 1
  desktop-tester:
    phases: [phase-3]
    role: primary
    max_parallel_instances: 1
  build-release-engineer:
    phases: [phase-4, phase-5]
    role: primary
    max_parallel_instances: 1
  product-manager:
    phases: [phase-1, phase-5]
    role: primary
    max_parallel_instances: 1
exception_handling:
  phase_failure:
    action: retry_then_escalate
    escalation_target: orchestrator
    max_retries: 3
  agent_unavailable:
    action: substitute_and_continue
    substitute_agent: desktop-developer
  quality_gate_blocked:
    action: auto_fix_then_pause
    auto_fix_agents: [desktop-developer, build-release-engineer]
