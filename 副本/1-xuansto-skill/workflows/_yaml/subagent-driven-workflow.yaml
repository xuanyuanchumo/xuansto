metadata:
  name: 子代理调度+两阶段审查工作流
  version: "3.2.0"
  description: 原子任务解析、并行/串行调度、独立子代理创建、两阶段审查、返工管理
  platform: all
  min_agents: 2
  max_agents: 10
phases:
  - id: phase-1
    name: 解析原子任务
    order: 0
    optional: false
    trigger_condition: 计划文件已就绪
    agents:
      primary: [subagent-dispatcher]
      supporting: []
    inputs:
      - name: 计划文件
        type: document
        required: true
    outputs:
      - name: 原子任务列表
        type: document
        validation: 每个任务≤5分钟+含文件路径+含验证步骤
    quality_gates:
      - gate_id: PLAN-ATOMIC
        blocking: true
        pass_criteria: 每个任务≤5分钟+含文件路径+含验证步骤
    timeout_minutes: 10
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-2
    name: 识别依赖关系
    order: 1
    optional: false
    trigger_condition: 原子任务列表已生成
    agents:
      primary: [subagent-dispatcher]
      supporting: []
    inputs:
      - name: 原子任务列表
        type: document
        required: true
        source_phase: phase-1
    outputs:
      - name: 任务依赖DAG
        type: document
        validation: 无循环依赖+并行/串行分组完成
      - name: 关键路径
        type: document
        validation: 关键路径已识别
    quality_gates:
      - gate_id: PLAN-ATOMIC
        blocking: true
        pass_criteria: 依赖图无循环依赖
    timeout_minutes: 5
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-3
    name: 创建子代理
    order: 2
    optional: false
    trigger_condition: 依赖关系已识别
    agents:
      primary: [subagent-dispatcher]
      supporting: [orchestrator]
    inputs:
      - name: 原子任务列表
        type: document
        required: true
        source_phase: phase-1
      - name: 任务依赖DAG
        type: document
        required: true
        source_phase: phase-2
    outputs:
      - name: 子代理调度计划
        type: document
        validation: 每个任务已匹配Agent+上下文已注入
      - name: 执行结果
        type: code
        validation: 子代理已完成任务
    quality_gates:
      - gate_id: SUBAGENT-REVIEW
        blocking: true
        pass_criteria: 所有子代理已创建并开始执行
    timeout_minutes: 60
    retry:
      max_attempts: 3
      backoff: exponential
  - id: phase-4
    name: 两阶段审查
    order: 3
    optional: false
    trigger_condition: 子代理任务执行完成
    agents:
      primary: [subagent-dispatcher]
      supporting: [code-reviewer]
    inputs:
      - name: 执行结果
        type: code
        required: true
        source_phase: phase-3
      - name: 计划文件
        type: document
        required: true
    outputs:
      - name: Stage 1审查报告
        type: document
        validation: 计划合规率100%
      - name: Stage 2审查报告
        type: document
        validation: 代码质量评分≥80
    quality_gates:
      - gate_id: SUBAGENT-REVIEW
        blocking: true
        pass_criteria: 两阶段审查通过+无返工任务
    timeout_minutes: 30
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-5
    name: 汇总审查结果
    order: 4
    optional: false
    trigger_condition: 两阶段审查完成
    agents:
      primary: [subagent-dispatcher]
      supporting: []
    inputs:
      - name: Stage 1审查报告
        type: document
        required: true
        source_phase: phase-4
      - name: Stage 2审查报告
        type: document
        required: true
        source_phase: phase-4
    outputs:
      - name: 审查汇总报告
        type: document
        validation: 包含通过/返工/阻塞统计
      - name: 返工任务清单
        type: document
        validation: 返工任务已标记原因和次数
    quality_gates:
      - gate_id: GATE-009
        blocking: true
        pass_criteria: 汇总报告已生成+返工任务已标记
    timeout_minutes: 10
    retry:
      max_attempts: 1
      backoff: fixed
  - id: phase-6
    name: 返工重新分派
    order: 5
    optional: true
    trigger_condition: 存在需返工的任务
    agents:
      primary: [subagent-dispatcher]
      supporting: []
    inputs:
      - name: 返工任务清单
        type: document
        required: true
        source_phase: phase-5
    outputs:
      - name: 返工执行结果
        type: code
        validation: 返工任务已重新执行
      - name: 返工审查报告
        type: document
        validation: 返工后审查通过或达到上限
    quality_gates:
      - gate_id: TEST-PASS
        blocking: true
        pass_criteria: 所有返工任务通过审查或已上报
    timeout_minutes: 30
    retry:
      max_attempts: 3
      backoff: exponential
agent_matrix:
  subagent-dispatcher:
    phases: [phase-1, phase-2, phase-3, phase-4, phase-5, phase-6]
    role: primary
    max_parallel_instances: 1
  orchestrator:
    phases: [phase-3]
    role: supporting
    max_parallel_instances: 1
  code-reviewer:
    phases: [phase-4]
    role: supporting
    max_parallel_instances: 2
exception_handling:
  phase_failure:
    action: retry_then_escalate
    escalation_target: orchestrator
    max_retries: 3
  agent_unavailable:
    action: substitute_and_continue
    substitute_agent: fullstack-engineer
  quality_gate_blocked:
    action: auto_fix_then_pause
    auto_fix_agents: [subagent-dispatcher]
