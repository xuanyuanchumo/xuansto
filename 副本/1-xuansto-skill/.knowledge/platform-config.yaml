platforms:
  trae:
    context_window: 128000
    system_prompt_overhead: 28000
    skill_md_level: ultra_compact
    max_parallel_agents: 3
    token_budget_per_task: 60000
    knowledge_injection_limit: 3
    compression_threshold: 0.6
    reference_file_max_lines: 200

  claude_code:
    context_window: 200000
    system_prompt_overhead: 30000
    skill_md_level: full
    max_parallel_agents: 8
    token_budget_per_task: 150000
    knowledge_injection_limit: 10
    compression_threshold: 0.8
    reference_file_max_lines: 1000

  cursor:
    context_window: 128000
    system_prompt_overhead: 28000
    skill_md_level: ultra_compact
    max_parallel_agents: 3
    token_budget_per_task: 60000
    knowledge_injection_limit: 3
    compression_threshold: 0.6
    reference_file_max_lines: 200

  windsurf:
    context_window: 128000
    system_prompt_overhead: 28000
    skill_md_level: ultra_compact
    max_parallel_agents: 3
    token_budget_per_task: 60000
    knowledge_injection_limit: 3
    compression_threshold: 0.6
    reference_file_max_lines: 200

  model_32k:
    context_window: 32000
    system_prompt_overhead: 15000
    skill_md_level: ultra_compact
    max_parallel_agents: 2
    token_budget_per_task: 25000
    knowledge_injection_limit: 2
    compression_threshold: 0.5
    reference_file_max_lines: 100

  model_64k:
    context_window: 64000
    system_prompt_overhead: 20000
    skill_md_level: compact
    max_parallel_agents: 3
    token_budget_per_task: 50000
    knowledge_injection_limit: 5
    compression_threshold: 0.6
    reference_file_max_lines: 200

auto_detection:
  enabled: true
  detection_method: environment_variable
  fallback_platform: trae
  log_detection_result: true
  environment_variables:
    trae: "TRAE_SESSION_ID"
    claude_code: "CLAUDE_CODE_SESSION"
    cursor: "CURSOR_SESSION_ID"
    windsurf: "WINDSURF_SESSION_ID"
