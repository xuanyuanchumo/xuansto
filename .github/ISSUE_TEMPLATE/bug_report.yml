name: Bug Report
description: Report a bug in xuansto-mcp-server or xuansto-skill-v2
labels: ["bug"]
body:
  - type: checkboxes
    id: component
    attributes:
      label: Component
      options:
        - label: MCP Server (xuansto-mcp-server)
        - label: Skill (xuansto-skill-v2)
        - label: Knowledge Base
        - label: Agent System
        - label: Degradation Chain
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Impact severity level
      options:
        - P0 - System down / Data loss
        - P1 - Core feature broken
        - P2 - Feature degraded
        - P3 - Minor inconvenience
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - v8.0.0-dev
        - v7.x
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction Frequency
      options:
        - Always
        - Often
        - Sometimes
        - Rarely
  - type: checkboxes
    id: degradation
    attributes:
      label: Degradation Impact
      options:
        - label: MCP unavailable, fallback works
        - label: MCP unavailable, fallback also broken
        - label: Not applicable (MCP available)
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, MCP client
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      render: shell
