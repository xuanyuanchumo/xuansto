name: Feature Request
description: Suggest a feature for xuansto
labels: ["enhancement"]
body:
  - type: checkboxes
    id: component
    attributes:
      label: Component
      options:
        - label: MCP Server (xuansto-mcp-server)
        - label: Skill (xuansto-skill-v2)
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
