version: "8.0.0"

core:
  - id: spec-first
    rule: "Spec > Test > Code：先规格再测试最后代码，覆盖率≥80%"
  - id: karpathy
    rule: "Think Before Coding | Simplicity First | Surgical Changes"
  - id: incremental
    rule: "分解→实现→测试→重复；3-Strike Protocol: 自动修复→换策略→升级处理"
  - id: script-standard
    rule: "Python优先 | UTF-8无BOM+无U+FFFD | 验证后删除临时脚本"
  - id: cross-platform
    rule: "Web+Desktop(Electron/Tauri/Flutter)，桌面端需IPC安全+代码签名"

token_budgets:
  phase_0_skeleton:
    trigger: "Skill触发时"
    load: "核心元数据：技能名称、版本、可用命令列表(无详情)"
    estimate: "≤2K"
    budget: 2000
  phase_1_functional:
    trigger: "用户执行命令时"
    load: "命令描述+MCP工具可用性+核心约束+核心Agent(Product Manager/Orchestrator/Architect)"
    estimate: "≤5K"
    budget: 5000
  phase_2_enhanced:
    trigger: "需要参考文档时"
    load: "Agent注册表+工作流定义+质量门禁摘要+参考文档URI+知识检索"
    estimate: "≤10K"
    budget: 10000
  phase_3_full:
    trigger: "深度分析时"
    load: "完整参考+模板+知识库访问+全部Agent定义+所有详情"
    estimate: "≤20K"
    budget: 20000

resource_priority:
  P0_must:
    - "SKILL.md核心约束"
    - "命令路由表"
    - "Agent索引表"
  P1_important:
    - "命令详细步骤"
    - "工作流Phase定义"
    - "MCP工具参数"
  P2_enhanced:
    - "参考文档(quality-gates.md等)"
    - "模板文件"
    - "知识库"
  P3_optional:
    - "示例文档"
    - "评估配置"
    - "披露资源"

quality_gates_summary:
  total: 54
  key_gates:
    - gate: DESIGN-SYSTEM-COMPLETE
      phase: 0
    - gate: ANTI-PATTERN-CHECK
      phase: 0
    - gate: BRAINSTORM-COMPLETE
      phase: 1
    - gate: PLAN-ATOMIC
      phase: 2
    - gate: TEST-FIRST
      phase: 3
    - gate: TEST-PASS
      phase: 4
    - gate: GATE-007
      phase: 4
    - gate: AI-PENTEST
      phase: 5
    - gate: SPEC-CONSISTENCY
      phase: 5
    - gate: UX-ACCEPTANCE
      phase: 6
    - gate: SIMPLIFICATION-BEHAVIOR
      phase: 7
    - gate: DESKTOP-BUILD/SIGN/UPDATE/CROSS
      phase: 8

disclosure:
  skill_md_phase_markers:
    phase_0:
      start: "<!-- PHASE_0_START -->"
      end: "<!-- PHASE_0_END -->"
      content: "YAML frontmatter + 命令列表 + MCP依赖 + 核心约束(5条)"
    phase_1:
      start: "<!-- PHASE_1_START -->"
      end: "<!-- PHASE_1_END -->"
      content: "执行入口 + 工作流Phase概览表 + 命令路由表(精简) + 核心Agent索引(编排+产品+工程层)"
    phase_2:
      start: "<!-- PHASE_2_START -->"
      end: "<!-- PHASE_2_END -->"
      content: "完整命令路由表({{include:commands/routes.yaml}}) + 完整Agent注册表({{include:agents/registry.yaml}}) + 外部参考文件表 + MCP工具摘要表"
    phase_3:
      start: "<!-- PHASE_3_START -->"
      end: "<!-- PHASE_3_END -->"
      content: "Hook系统说明 + 模型路由说明 + 关键规则"
  loading_phases:
    - phase: "Phase 0: 骨架"
      skill_md_range: "PHASE_0_START → PHASE_0_END"
      available: "核心元数据、命令列表(无详情)、MCP依赖声明、核心约束(5条)"
      unavailable: "命令执行步骤、工作流详情、Agent详情、参考文档、知识检索、Hook系统、模型路由"
      token_budget: 2000
      resource_priority: P0_must
    - phase: "Phase 1: 功能"
      skill_md_range: "PHASE_0_START → PHASE_1_END"
      available: "命令路由(精简)+执行入口+工作流Phase概览+核心Agent(编排+产品+工程层13个)+门禁检查"
      unavailable: "完整命令路由(含降级)、完整Agent注册表(57个)、参考文档、知识检索、Hook系统、模型路由"
      token_budget: 5000
      resource_priority: P0_must + P1_important
    - phase: "Phase 2: 增强"
      skill_md_range: "PHASE_0_START → PHASE_2_END"
      available: "完整命令路由(含降级策略)+完整Agent注册表(13层57个)+外部参考文件+MCP工具摘要+知识检索"
      unavailable: "Hook系统详情、模型路由详情、关键规则完整说明"
      token_budget: 10000
      resource_priority: P0_must + P1_important + P2_enhanced
    - phase: "Phase 3: 完整"
      skill_md_range: "PHASE_0_START → PHASE_3_END"
      available: "全部功能可用: Hook系统+模型路由+关键规则+全部上述内容"
      unavailable: "无"
      token_budget: 20000
      resource_priority: P0_must + P1_important + P2_enhanced + P3_optional
  resource_priority_phase_mapping:
    P0_must:
      loaded_from: "Phase 0"
      items:
        - "YAML frontmatter(元数据+触发条件)"
        - "命令列表(31个命令名称)"
        - "MCP依赖声明"
        - "核心约束(5条精简版)"
    P1_important:
      loaded_from: "Phase 1"
      items:
        - "执行入口步骤"
        - "工作流Phase概览表(9阶段)"
        - "命令路由表(精简版: 意图→命令→MCP工具链→Phase)"
        - "核心Agent索引(编排3+产品4+工程6=13个)"
    P2_enhanced:
      loaded_from: "Phase 2"
      items:
        - "完整命令路由表(含降级策略, {{include:commands/routes.yaml}})"
        - "完整Agent注册表(13层57个, {{include:agents/registry.yaml}})"
        - "外部参考文件表({{include:triggers.yaml}}, {{include:constraints.yaml}}等)"
        - "MCP工具摘要表(26个工具)"
    P3_optional:
      loaded_from: "Phase 3"
      items:
        - "Hook系统说明(三级配置+关键Hook)"
        - "模型路由说明(fast/standard/deep)"
        - "关键规则(2-Action/3-Strike/仲裁等)"
  on_unavailable:
    - rule: "通过 xuansto://loading/status 披露当前可用功能范围"
    - rule: "提示用户可通过 resource_load_status(preload) 推进加载"
    - rule: "降级到可用功能范围内执行"
  degradation_on_unavailable:
    command_execution:
      unavailable_in: "Phase 0"
      behavior: "仅展示命令列表，不执行；提示用户执行任意命令以推进到Phase 1"
    workflow_details:
      unavailable_in: "Phase 0"
      behavior: "使用核心约束中的精简规则替代完整工作流定义"
    full_command_routes:
      unavailable_in: "Phase 0, Phase 1"
      behavior: "Phase 0/1使用精简路由表(无降级策略列)；Phase 2加载完整路由含降级策略"
    full_agent_registry:
      unavailable_in: "Phase 0, Phase 1"
      behavior: "Phase 0无Agent信息；Phase 1使用核心Agent索引(13个)；Phase 2加载完整57个Agent注册表"
    knowledge_search:
      unavailable_in: "Phase 0, Phase 1"
      behavior: "跳过知识检索步骤，使用内嵌模板和默认知识；Phase 2起可用knowledge_search工具"
    reference_documents:
      unavailable_in: "Phase 0, Phase 1"
      behavior: "使用SKILL.md内嵌摘要替代参考文档；Phase 2起通过{{include:}}按需加载"
    hook_system:
      unavailable_in: "Phase 0, Phase 1, Phase 2"
      behavior: "使用minimal配置(security-block仅)；Phase 3加载完整Hook系统说明"
    model_routing:
      unavailable_in: "Phase 0, Phase 1, Phase 2"
      behavior: "默认使用standard路由；Phase 3加载完整模型路由说明"

degradation:
  mcp_detection: "尝试调用skill_analyze，失败则进入降级模式"
  script_fallback: "使用 python scripts/xxx.py --format json 调用"
  result_format: "降级模式下结果包装为与MCP工具相同的JSON结构"
  tool_fallbacks:
    skill_analyze: "scripts/skill-test.py --analyze"
    quality_gate_check: "scripts/skill-test.py --gate"
    knowledge_search: "scripts/knowledge-server.py --search"
    knowledge_inject: "scripts/knowledge_server/main.py --inject"
    spec_drift_detect: "scripts/spec-drift-detector.py → 内联漂移检测"
    security_scan: "scripts/agentic-security-scanner.py → 内联agentic+dependency扫描"
    code_simplify: "scripts/code-simplifier.py → 内联simplify+dedup"
    session_manage: "scripts/init-session.py / scripts/session-catchup.py / scripts/session-persist.py"
    workflow_dispatch: "scripts/project-initializer.py (start) / 内联Phase推进"
    agent_status: "静态注册表查询(agents/目录) / scripts/skill-test.py --agents"
    hook_manage: "scripts/check-encoding.py / scripts/token-budget-guard.py / scripts/session-persist.py / 内联Hook执行"
    resource_load_status: "内联状态检查(resource_state.json)"
    context_compress: "scripts/context-compressor.py"
    server_health: "scripts/health-checker.py → 降级状态返回"
  knowledge_search_degradation: "ChromaDB→SQLite FTS→关键词匹配"

key_rules:
  - "2-Action Research | 3-Strike Error | Chesterton's Fence | Loop Enforcement"
  - "Confidence≥80 | 三级仲裁(L1技术→L2策略ADR→L3安全人工)"
  - "UTF-8无BOM+LF | Python优先 | 业务注释中文"
  - "Git: <类型>(<范围>): <中文描述> | 禁止Shell(.sh) | 五步闭环"
