# CI/CD 流水线配置模板
# 适用于 GitHub Actions / GitLab CI / Jenkins 等平台
# 根据实际平台调整语法

name: "{项目名称} CI/CD Pipeline"

# 触发条件
trigger:
  branches:
    - main
    - develop
  pull_request:
    branches:
      - main

# 环境变量
env:
  PROJECT_NAME: "{项目名称}"
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

# 阶段定义
stages:
  # 阶段1: 代码质量检查
  lint:
    description: "代码质量与编码规范检查"
    steps:
      - name: "编码规范检查"
        command: "检查UTF-8无BOM、LF行尾、Python无PEP263声明"
        script: "python scripts/check-encoding.py --dir src/"
        blocking: true
      - name: "注释语言检查"
        command: "检查业务注释包含中文"
        script: "python scripts/check-comment-lang.py --dir src/"
        blocking: false
      - name: "Lint检查"
        command: "代码风格与错误检查"
        script: "ruff check src/ || flake8 src/"
        blocking: true

  # 阶段2: 测试
  test:
    description: "单元测试、集成测试与覆盖率"
    steps:
      - name: "单元测试"
        command: "运行单元测试套件"
        script: "pytest tests/unit/ -v --tb=short"
        blocking: true
      - name: "集成测试"
        command: "运行集成测试套件"
        script: "pytest tests/integration/ -v"
        blocking: true
      - name: "覆盖率检查"
        command: "代码覆盖率>=80%"
        script: "pytest --cov=src --cov-fail-under=80"
        blocking: true

  # 阶段3: 安全扫描
  security:
    description: "安全审计与依赖扫描"
    steps:
      - name: "依赖漏洞扫描"
        command: "扫描已知CVE漏洞"
        script: "safety check || npm audit"
        blocking: true
      - name: "脚本安全扫描"
        command: "临时脚本沙箱约束检查"
        script: "python scripts/script-security-scanner.py --dir .knowledge/temp-scripts/"
        blocking: true
      - name: "Agentic安全扫描"
        command: "OWASP Agentic Top 10合规"
        script: "python scripts/agentic-security-scanner.py --dir src/"
        blocking: false

  # 阶段4: 构建
  build:
    description: "构建产物打包"
    steps:
      - name: "Web构建"
        command: "Web应用构建"
        script: "npm run build"
        blocking: true
      - name: "桌面构建(可选)"
        command: "桌面应用多平台构建"
        script: "条件触发: 仅桌面项目"
        blocking: true
        optional: true

  # 阶段5: 部署
  deploy:
    description: "部署到目标环境"
    steps:
      - name: "预发布部署"
        command: "部署到预发布环境"
        script: "部署脚本"
        blocking: true
        environment: staging
      - name: "生产部署"
        command: "部署到生产环境"
        script: "部署脚本"
        blocking: true
        environment: production
        requires_approval: true

# 质量门禁配置
quality_gates:
  - gate_id: FILE-ENCODING
    blocking: true
    description: "所有文件UTF-8 without BOM"
  - gate_id: LINT
    blocking: true
    description: "0错误"
  - gate_id: TEST-PASS
    blocking: true
    description: "测试通过率100%"
  - gate_id: COVERAGE
    blocking: true
    description: "单元>=80%, 集成>=70%"
  - gate_id: SECURITY
    blocking: true
    description: "无P0/P1漏洞"
  - gate_id: SCRIPT-CLEANUP
    blocking: true
    description: ".knowledge/temp-scripts/为空"

# 通知配置
notifications:
  on_failure:
    - type: "email"
      recipients: ["dev-team@example.com"]
  on_success:
    - type: "email"
      recipients: ["product-team@example.com"]
