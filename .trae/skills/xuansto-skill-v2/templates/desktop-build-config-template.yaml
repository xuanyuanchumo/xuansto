framework: electron

platforms:
  - win
  - mac
  - linux

app:
  name: "MyApp"
  productName: "My Application"
  appId: "com.example.myapp"
  version: "1.0.0"
  buildNumber: 1
  copyright: "Copyright © 2024 Example Corp"
  category: "Utility"
  description: "A cross-platform desktop application"

build:
  frontend:
    command: "npm run build"
    outputDir: "dist"
    env:
      NODE_ENV: "production"

  electron:
    main: "main.js"
    files:
      - "dist/**/*"
      - "main.js"
      - "preload.js"
    extraResources:
      - from: "assets/"
        to: "assets/"
    ignore:
      - "node_modules/**/*"
      - "src/**/*"
      - ".env*"

  tauri:
    srcDir: "src-tauri"
    beforeBuildCommand: "npm run build"
    beforeDevCommand: "npm run dev"
    devPath: "http://localhost:1420"
    distDir: "../dist"

signing:
  enabled: false
  win:
    certPath: "./certs/windows.pfx"
    certPasswordEnv: "WINDOWS_CERT_PASSWORD"
    publisherName: "Example Corp"
    timestampServer: "http://timestamp.digicert.com"
    signingHashAlgorithms:
      - "sha256"
  mac:
    identity: "Developer ID Application: Example Corp (TEAMID)"
    entitlements: "./certs/entitlements.mac.plist"
    entitlementsInherit: "./certs/entitlements.mac.plist"
    hardenedRuntime: true
    notarize:
      teamId: "TEAMID"
      appleId: "dev@example.com"
      appleIdPasswordEnv: "APPLE_ID_PASSWORD"
  linux:
    gpgKey: "./certs/linux.gpg"
    gpgPassphraseEnv: "LINUX_GPG_PASSPHRASE"

autoUpdate:
  enabled: true
  provider: "github"
  channel: "latest"
  url: ""

output:
  dir: "release"
  clean: true

electronBuilder:
  win:
    target:
      - target: "nsis"
        arch:
          - "x64"
      - target: "portable"
        arch:
          - "x64"
    icon: "build/icon.ico"
  mac:
    target:
      - target: "dmg"
        arch:
          - "universal"
      - target: "zip"
        arch:
          - "universal"
    icon: "build/icon.icns"
    minimumSystemVersion: "10.13.0"
  linux:
    target:
      - target: "AppImage"
        arch:
          - "x64"
      - target: "deb"
        arch:
          - "x64"
    icon: "build/icon.png"
    category: "Utility"
  nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    installerIcon: "build/installer.ico"
    uninstallerIcon: "build/uninstaller.ico"
    installerHeaderIcon: "build/installer-header.bmp"
  dmg:
    contents:
      - x: 130
        y: 220
      - x: 410
        y: 220
        type: "link"
        path: "/Applications"
  appImage:
    license: "./LICENSE"
  deb:
    depends:
      - "libnotify4"
      - "libxtst6"
      - "libnss3"

tauriConf:
  build: {}
  bundle:
    active: true
    targets:
      - "nsis"
      - "msi"
      - "dmg"
      - "app"
      - "deb"
      - "appimage"
    icon:
      - "icons/32x32.png"
      - "icons/128x128.png"
      - "icons/128x128@2x.png"
      - "icons/icon.icns"
      - "icons/icon.ico"
    resources: []
    copyright: ""
    category: "Utility"
    shortDescription: ""
    longDescription: ""
    windows:
      certificateThumbprint: ""
      digestAlgorithm: "sha256"
      timestampUrl: "http://timestamp.digicert.com"
    macOS:
      frameworks: []
      minimumSystemVersion: "10.13"
      exceptionDomain: ""
      signingIdentity: ""
      providerShortName: ""
      entitlements: ""
    linux:
      deb:
        depends: []
      appimage:
        bundleMediaFramework: false
  plugins:
    updater:
      endpoints:
        - "https://updates.example.com/{{target}}/{{arch}}/{{current_version}}"
      pubkey: ""
