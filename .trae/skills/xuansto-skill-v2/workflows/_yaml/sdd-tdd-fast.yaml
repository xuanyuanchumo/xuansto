metadata:
  name: SDD+TDD快速开发工作流
  version: "3.2.0"
  description: 快速4阶段SDD+TDD轻量开发工作流
  platform: all
  min_agents: 3
  max_agents: 8
phases:
  - id: phase-1
    name: 快速需求
    order: 0
    optional: false
    trigger_condition: 用户请求快速开发或小型任务
    agents:
      primary: [fullstack-engineer]
      supporting: []
    inputs:
      - name: 用户需求描述
        type: document
        required: true
    outputs:
      - name: 简化需求文档
        type: document
        validation: 核心功能点明确
      - name: 实现方案说明
        type: document
        validation: 实现方案可行
    quality_gates:
      - gate_id: core_features_defined
        blocking: true
        pass_criteria: 核心功能点明确
      - gate_id: implementation_feasible
        blocking: true
        pass_criteria: 实现方案可行
    timeout_minutes: 60
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-2
    name: 架构设计
    order: 1
    optional: false
    trigger_condition: 快速需求完成
    agents:
      primary: [fullstack-engineer]
      supporting: []
    inputs:
      - name: 简化需求文档
        type: document
        required: true
        source_phase: phase-1
      - name: 实现方案说明
        type: document
        required: true
        source_phase: phase-1
    outputs:
      - name: 简化架构设计
        type: document
        validation: 设计评审通过
      - name: 设计令牌同步确认
        type: document
        validation: Design Tokens与代码同步
    quality_gates:
      - gate_id: design_review
        blocking: true
        pass_criteria: 设计评审通过
      - gate_id: design_tokens_sync
        blocking: false
        pass_criteria: Design Tokens与代码同步
    timeout_minutes: 30
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-4
    name: TDD开发与代码审查
    order: 2
    optional: false
    trigger_condition: 架构设计完成
    agents:
      primary: [fullstack-engineer, unit-tester, code-reviewer]
      supporting: []
    inputs:
      - name: 简化需求文档
        type: document
        required: true
        source_phase: phase-1
      - name: 实现方案
        type: document
        required: true
        source_phase: phase-2
    outputs:
      - name: 源代码
        type: code
        validation: 核心测试通过
      - name: 核心测试用例
        type: code
        validation: 覆盖率>=60%
      - name: 审查反馈
        type: document
      - name: 修复确认
        type: document
    quality_gates:
      - gate_id: core_tests_pass
        blocking: true
        pass_criteria: 核心测试用例通过
      - gate_id: coverage_60
        blocking: true
        pass_criteria: 代码覆盖率>=60%
      - gate_id: no_critical_issues
        blocking: true
        pass_criteria: 无严重问题且核心逻辑正确
    timeout_minutes: 120
    retry:
      max_attempts: 3
      backoff: exponential
  - id: phase-5
    name: 验证
    order: 3
    optional: false
    trigger_condition: TDD开发与代码审查通过
    agents:
      primary: [fullstack-engineer]
      supporting: []
    inputs:
      - name: 审查通过的代码
        type: code
        required: true
        source_phase: phase-4
    outputs:
      - name: 验证结果
        type: document
        validation: 功能符合预期
      - name: 交付确认
        type: document
        validation: 演化闭环完成
    quality_gates:
      - gate_id: function_match
        blocking: true
        pass_criteria: 功能符合预期
      - gate_id: no_obvious_defects
        blocking: true
        pass_criteria: 无明显缺陷
      - gate_id: evolution_closed
        blocking: true
        pass_criteria: 演化闭环完成
    timeout_minutes: 30
    retry:
      max_attempts: 2
      backoff: fixed
agent_matrix:
  fullstack-engineer:
    phases: [phase-1, phase-2, phase-4, phase-5]
    role: primary
    max_parallel_instances: 2
  unit-tester:
    phases: [phase-4]
    role: primary
    max_parallel_instances: 1
  code-reviewer:
    phases: [phase-4]
    role: primary
    max_parallel_instances: 1
exception_handling:
  phase_failure:
    action: retry_then_escalate
    escalation_target: orchestrator
    max_retries: 3
  agent_unavailable:
    action: substitute_and_continue
    substitute_agent: fullstack-engineer
  quality_gate_blocked:
    action: auto_fix_then_pause
    auto_fix_agents: [fullstack-engineer]
