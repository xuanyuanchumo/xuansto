metadata:
  name: Flutter桌面应用开发工作流
  version: "3.2.0"
  description: Flutter桌面应用开发与构建工作流
  platform: desktop
  min_agents: 3
  max_agents: 8
phases:
  - id: phase-0
    name: Flutter桌面架构设计
    order: 0
    optional: false
    trigger_condition: 用户请求Flutter桌面应用开发
    agents:
      primary: [system-architect, desktop-developer]
      supporting: []
    inputs:
      - name: 产品需求文档
        type: document
        required: true
      - name: Flutter版本约束
        type: document
        required: true
    outputs:
      - name: Flutter架构设计文档
        type: document
        validation: 架构设计符合Flutter最佳实践
      - name: 桌面框架选型ADR
        type: document
        validation: Flutter桌面可行性已评估
      - name: 平台通道设计文档
        type: document
        validation: 平台通道接口已定义
    quality_gates:
      - gate_id: GATE-003
        blocking: true
        pass_criteria: 架构设计符合Flutter最佳实践
      - gate_id: GATE-004
        blocking: true
        pass_criteria: 平台通道接口已定义
    timeout_minutes: 90
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-4
    name: Flutter桌面TDD开发
    order: 1
    optional: false
    trigger_condition: 架构设计完成
    agents:
      primary: [fullstack-engineer, desktop-developer, desktop-ui-adapter]
      supporting: []
    inputs:
      - name: Flutter架构设计文档
        type: document
        required: true
        source_phase: phase-0
      - name: 平台通道设计文档
        type: document
        required: true
        source_phase: phase-0
    outputs:
      - name: Flutter Dart代码
        type: code
        validation: 代码审查通过
      - name: 平台特定代码
        type: code
        validation: 原生代码审查通过
      - name: 测试代码
        type: code
        validation: 覆盖率>=80%
      - name: 集成测试代码
        type: code
    quality_gates:
      - gate_id: TEST-PASS
        blocking: true
        pass_criteria: 所有测试通过
      - gate_id: GATE-005
        blocking: true
        pass_criteria: 覆盖率>=80%
      - gate_id: GATE-009
        blocking: true
        pass_criteria: 代码审查通过
    timeout_minutes: 240
    retry:
      max_attempts: 3
      backoff: exponential
  - id: phase-5
    name: Flutter桌面验证
    order: 2
    optional: false
    trigger_condition: TDD开发完成
    agents:
      primary: [qa-engineer, desktop-developer]
      supporting: []
    inputs:
      - name: 通过审查的代码
        type: code
        required: true
        source_phase: phase-4
    outputs:
      - name: 跨平台测试报告
        type: document
        validation: 三平台功能一致性>95%
      - name: 性能测试报告
        type: document
        validation: 性能指标达标
      - name: 可访问性报告
        type: document
    quality_gates:
      - gate_id: DESKTOP-CROSS
        blocking: true
        pass_criteria: 三平台功能一致性>95%
      - gate_id: GATE-011
        blocking: true
        pass_criteria: 各平台冒烟测试通过
      - gate_id: PERFORMANCE
        blocking: true
        pass_criteria: 性能指标达标
    timeout_minutes: 120
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-8
    name: Flutter桌面构建与发布
    order: 3
    optional: false
    trigger_condition: 验证通过
    agents:
      primary: [build-release-engineer, desktop-developer]
      supporting: []
    inputs:
      - name: 验证通过的代码
        type: code
        required: true
        source_phase: phase-5
    outputs:
      - name: MSIX安装包
        type: artifact
        validation: Windows构建成功
      - name: DMG安装包
        type: artifact
        validation: macOS构建成功
      - name: AppImage/DEB安装包
        type: artifact
        validation: Linux构建成功
      - name: 发布说明文档
        type: document
        validation: 发布说明完整
    quality_gates:
      - gate_id: DESKTOP-BUILD
        blocking: true
        pass_criteria: 所有平台构建成功
      - gate_id: DESKTOP-SIGN
        blocking: true
        pass_criteria: 代码签名与公证通过
      - gate_id: DOC-COMPLETENESS
        blocking: true
        pass_criteria: 发布说明完整
    timeout_minutes: 180
    retry:
      max_attempts: 2
      backoff: exponential
agent_matrix:
  system-architect:
    phases: [phase-0]
    role: primary
    max_parallel_instances: 1
  desktop-developer:
    phases: [phase-0, phase-4, phase-5, phase-8]
    role: primary
    max_parallel_instances: 1
  fullstack-engineer:
    phases: [phase-4]
    role: primary
    max_parallel_instances: 2
  desktop-ui-adapter:
    phases: [phase-4]
    role: primary
    max_parallel_instances: 1
  qa-engineer:
    phases: [phase-5]
    role: primary
    max_parallel_instances: 1
  build-release-engineer:
    phases: [phase-8]
    role: primary
    max_parallel_instances: 1
exception_handling:
  phase_failure:
    action: retry_then_escalate
    escalation_target: orchestrator
    max_retries: 3
  agent_unavailable:
    action: substitute_and_continue
    substitute_agent: desktop-developer
  quality_gate_blocked:
    action: auto_fix_then_pause
    auto_fix_agents: [desktop-developer, fullstack-engineer]
