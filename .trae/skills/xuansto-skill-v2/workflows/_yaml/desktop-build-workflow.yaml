metadata:
  name: 桌面构建与发布工作流
  version: "3.2.0"
  description: 桌面应用构建签名与发布工作流
  platform: desktop
  min_agents: 2
  max_agents: 6
phases:
  - id: phase-4
    name: 构建准备
    order: 0
    optional: false
    trigger_condition: 桌面项目验收通过或用户请求构建发布
    agents:
      primary: [build-release-engineer, desktop-developer]
      supporting: []
    inputs:
      - name: Phase6验收通过报告
        type: document
        required: true
      - name: 项目源代码
        type: code
        required: true
      - name: 构建配置文件
        type: document
        required: true
    outputs:
      - name: 构建环境检查报告
        type: document
        validation: 构建环境满足要求
      - name: 构建计划
        type: document
      - name: 版本信息文件
        type: document
        validation: 版本号合规且CHANGELOG已更新
    quality_gates:
      - gate_id: DESKTOP-BUILD
        blocking: true
        pass_criteria: 构建环境满足要求
      - gate_id: DESKTOP-SIGN
        blocking: true
        pass_criteria: 签名证书可用且未过期
      - gate_id: GATE-003
        blocking: true
        pass_criteria: 版本号合规
      - gate_id: DOC-COMPLETENESS
        blocking: true
        pass_criteria: CHANGELOG已更新
    timeout_minutes: 60
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-5
    name: 构建与签名验证
    order: 1
    optional: false
    trigger_condition: 构建准备完成
    agents:
      primary: [build-release-engineer, security-auditor]
      supporting: [desktop-developer, cicd-specialist]
    inputs:
      - name: 构建计划
        type: document
        required: true
        source_phase: phase-4
      - name: 项目源代码
        type: code
        required: true
      - name: 构建配置
        type: document
        required: true
    outputs:
      - name: 各平台安装包
        type: artifact
        validation: 所有目标平台构建成功
      - name: 已签名的安装包
        type: artifact
        validation: 所有平台签名验证通过
      - name: 签名验证报告
        type: document
      - name: 更新清单文件
        type: document
        validation: 更新清单格式正确
    quality_gates:
      - gate_id: DESKTOP-BUILD
        blocking: true
        pass_criteria: 所有目标平台构建成功
      - gate_id: DESKTOP-SIGN
        blocking: true
        pass_criteria: 所有平台签名验证通过且macOS公证通过
      - gate_id: DESKTOP-UPDATE
        blocking: true
        pass_criteria: 更新清单格式正确且回滚版本可用
      - gate_id: GATE-013
        blocking: true
        pass_criteria: 所有分发渠道可用
    timeout_minutes: 180
    retry:
      max_attempts: 2
      backoff: exponential
  - id: phase-8
    name: 发布验证
    order: 2
    optional: false
    trigger_condition: 构建与签名验证通过
    agents:
      primary: [build-release-engineer, desktop-developer, cicd-specialist]
      supporting: [security-auditor]
    inputs:
      - name: 已签名的安装包
        type: artifact
        required: true
        source_phase: phase-5
      - name: 更新清单文件
        type: document
        required: true
        source_phase: phase-5
    outputs:
      - name: 安装验证报告
        type: document
        validation: 各平台安装卸载正常
      - name: 自动更新验证报告
        type: document
        validation: 自动更新流程验证通过
      - name: 安全验证报告
        type: document
        validation: 安全验证无问题
      - name: Release Notes
        type: document
        validation: 发布文档完整
    quality_gates:
      - gate_id: DESKTOP-BUILD
        blocking: true
        pass_criteria: 各平台安装卸载正常
      - gate_id: DESKTOP-UPDATE
        blocking: true
        pass_criteria: 自动更新流程验证通过
      - gate_id: GATE-012
        blocking: true
        pass_criteria: 安全验证无问题
      - gate_id: DOC-COMPLETENESS
        blocking: true
        pass_criteria: 发布文档完整
    timeout_minutes: 120
    retry:
      max_attempts: 2
      backoff: fixed
agent_matrix:
  build-release-engineer:
    phases: [phase-4, phase-5, phase-8]
    role: primary
    max_parallel_instances: 1
  desktop-developer:
    phases: [phase-4, phase-8]
    role: primary
    max_parallel_instances: 1
  security-auditor:
    phases: [phase-5]
    role: primary
    max_parallel_instances: 1
  cicd-specialist:
    phases: [phase-8]
    role: primary
    max_parallel_instances: 1
exception_handling:
  phase_failure:
    action: retry_then_escalate
    escalation_target: orchestrator
    max_retries: 3
  agent_unavailable:
    action: substitute_and_continue
    substitute_agent: build-release-engineer
  quality_gate_blocked:
    action: auto_fix_then_pause
    auto_fix_agents: [desktop-developer, build-release-engineer]
