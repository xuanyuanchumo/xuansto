# Agency-Agent Bridge 配置 v5.1
agent_discovery:
  scan_path: "../agency-agents"
  recursive: true
  file_pattern: "*.md"
  exclude_dirs: [".git", "node_modules", "__pycache__", "examples", "integrations", "scripts"]
  refresh_interval_minutes: 60
  cache_enabled: true
  cache_ttl_minutes: 30

routing:
  strategy: hybrid  # rule_based | semantic | hybrid
  max_recommendations: 5
  confidence_threshold: 0.6
  context_weights:
    specialty_match: 0.4
    technology_fit: 0.3
    historical_success: 0.2
    recency_bonus: 0.1
  fallback_agent: "engineering-senior-developer"

orchestration:
  max_concurrent_agents: 4
  timeout_per_phase_minutes: 30
  total_session_timeout_minutes: 180
  retry_limits:
    max_retries_per_task: 3
    backoff_multiplier: 2
    base_delay_seconds: 30
  quality_gate:
    require_qa_pass: true
    evidence_required: true
  pipeline_phases:
    - planning
    - architecture
    - development
    - qa_loop
    - integration

context_builder:
  max_file_count: 20
  max_snippet_lines: 100
  exclude_patterns:
    - "*.lock"
    - "*.min.*"
    - "node_modules/**"
    - "__pycache__/**"
    - ".git/**"
    - "dist/**"
    - "build/**"
    - "*.pyc"
  project_config_files:
    - package.json
    - pyproject.toml
    - Cargo.toml
    - go.mod
    - pom.xml
    - requirements.txt

result_collector:
  output_formats: [markdown, json]
  conflict_resolution_strategy: prefer_primary  # merge | prefer_primary | prefer_secondary | escalate
  persist_results: true
  results_log_dir: "logs/agent_results"

logging:
  level: INFO
  log_dir: "logs/agency_bridge"
  max_log_size_mb: 10
  backup_count: 5
