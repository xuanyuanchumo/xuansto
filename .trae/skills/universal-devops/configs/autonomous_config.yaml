# AI自主操作配置
# ===============

autonomous:
  # 风险阈值
  risk_thresholds:
    low: 3
    medium: 5
    high: 7
    critical: 9
  
  # 审批门禁
  approval_gates:
    require_approval_above_risk: "high"
    auto_approve_below_risk: "low"
    escalation_path: ["ai_review", "human_review", "block"]
  
  # 模式偏好
  mode_preference:
    default: "autonomous"
    fallback_to_automated: true
    hybrid_enabled: true
  
  # 安全约束
  safety_constraints:
    max_files_per_operation: 20
    max_lines_changed_per_operation: 500
    require_backup_before_modify: true
    allow_destructive_operations: false
    
  # 审计设置
  audit:
    log_all_decisions: true
    log_all_executions: true
    retain_audit_logs_days: 90
