# 多Agent资源协调器配置 (MARC Configuration)

# 资源注册表配置
resource_registry:
  resource_types:
    file:
      default_concurrent_access: 1  # 文件默认串行访问
      priority: 8
    terminal:
      default_concurrent_access: 1
      priority: 7
    network:
      default_concurrent_access: 10
      priority: 5
    system_memory:
      default_concurrent_access: 999  # 内存不限制并发数
      priority: 9
    system_cpu:
      default_concurrent_access: 999
      priority: 9

# 锁管理器配置
lock_manager:
  lock_types:
    exclusive:
      default_timeout_seconds: 120
      enable_priority_inheritance: true
      max_queue_length: 50
    read_write:
      default_timeout_seconds: 180
      writer_priority_boost: 2  # 写者优先级提升
      max_readers: 10
    optimistic:
      version_field: "_version"
      max_retry_on_conflict: 3
      conflict_resolution: "last_write_wins"
      
  global_settings:
    deadlock_detection_interval_seconds: 10
    lock_acquisition_timeout_seconds: 30
    audit_log_enabled: true
    audit_log_path: "logs/marc_audit.log"

# 调度队列配置
scheduler_queue:
  default_strategy: "priority"  # priority/fifo/fair_share
  
  priority_queue:
    max_size: 1000
    aging_factor: 0.01  # 时间老化因子（等待越久优先级越高）
    
  fair_share:
    time_slice_ms: 100
    rebalance_interval_ms: 1000
    
  dependencies:
    enable_topological_sort: true
    max_dependency_depth: 20
    cycle_detection_enabled: true

# 死锁检测器配置
deadlock_detector:
  detection_algorithm: "wait_for_graph"  # wait_for_graph/timeout_based
  detection_interval_seconds: 10
  
  recovery_strategies:
    default: "force_release_lowest_priority"
    available_strategies:
      - name: "force_release_lowest_priority"
        description: "强制释放最低优先级Agent持有的锁"
      - name: "force_release_oldest"
        description: "强制释放等待最久的Agent持有的锁"
      - name: "force_release_most_holding"
        description: "释放持有最多资源的Agent"
        
  prevention:
    enable_global_ordering: true  # 全局统一资源申请顺序
    suggest_alternatives: true  # 死锁发生后建议替代方案

# 配额管理器配置
quota_manager:
  memory:
    per_agent_max_mb: 512
    global_warning_threshold: 0.80  # 80%
    global_critical_threshold: 0.95  # 95%
    gc_on_critical: true
    
  network:
    api_calls_per_minute: 60
    token_bucket_capacity: 70  # 允许突发70次
    max_concurrent_connections_per_agent: 10
    max_global_connections: 50
    bandwidth_limit_mbps: 0  # 0=不限制
    
  cpu:
    fair_share_enabled: true
    time_slice_ms: 100
    max_cpu_percent_per_agent: 25.0
    scheduling_algorithm: "cfs"  # completely_fair_scheduler
    
  enforcement:
    action_on_exceed: "throttle"  # throttle/reject/warn
    grace_period_seconds: 5  # 超限后宽限期
    notification_enabled: true
