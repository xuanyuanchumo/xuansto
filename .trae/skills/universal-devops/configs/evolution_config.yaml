# Universal DevOps v4.0 - 演化系统配置
# ====================================

# 自演化系统总开关
evolution:
  enabled: true
  version: "1.0.0"

# 四阶演化组件配置
components:
  self_iterator:
    name: "自迭代器"
    module: "evolution/self_iterator.py"
    config:
      # 定时触发
      schedule:
        cron: "0 2 * * *"       # 每日凌晨2点
        interval_days: 7         # 每7天深度演化
        
      # 数据收集范围
      collection_scope:
        - code_metrics
        - test_results
        - coverage_data
        - documentation_status
        - performance_baseline
        - security_scan_results
        
      # 迭代机会识别
      opportunity_detection:
        min_confidence: 0.7
        categories:
          - optimization
          - refactoring
          - feature_enhancement
          - bug_prevention
          
      # 输出限制
      max_suggestions_per_cycle: 10
      priority_threshold: "medium"

  self_optimizer:
    name: "自优化器"
    module: "evolution/self_optimizer.py"
    config:
      # 优化目标
      objectives:
        - name: "performance"
          priority: high
          target: "improve_response_time_by_10_percent"
        - name: "resource_efficiency"
          priority: medium
          target: "reduce_memory_by_15_percent"
        - name: "code_quality"
          priority: high
          target: "reduce_complexity_to_below_8"
          
      # 优化策略
      strategies:
        - algorithm_optimization
        - caching_strategy
        - query_optimization
        - resource_pooling
        - lazy_loading
        
      # 安全约束
      safety_constraints:
        max_change_impact: "low"
        require_rollback_plan: true
        preserve_behavior: true
        test_coverage_required: 100
        
      # 执行限制
      execution:
        max_concurrent_optimizations: 3
        timeout_per_optimization: 3600  # 1小时
        dry_run_mode: false              # 生产环境建议先开启dry-run

  self_repairer:
    name: "自修复器"
    module: "evolution/self_repairer.py"
    config:
      # 自动修复类型
      repair_types:
        - name: "syntax_error"
          auto_fix: true
          confidence_required: 0.95
        - name: "import_error"
          auto_fix: true
          confidence_required: 0.9
        - name: "type_error"
          auto_fix: true
          confidence_required: 0.85
        - name: "logic_bug"
          auto_fix: false           # 逻辑Bug需人工确认
          confidence_required: 0.99
        - name: "security_vulnerability"
          auto_fix: false           # 安全问题必须人工审核
          confidence_required: 1.0
          
      # 修复流程
      workflow:
        detect:
          tools: ["static_analyzer", "test_runner", "linter"]
        diagnose:
          max_root_causes: 3
          include_context_lines: 10
        fix:
          generate_multiple_solutions: true
          rank_by_confidence: true
        verify:
          run_full_test_suite: true
          require_code_review: true
          
      # 回滚机制
      rollback:
        auto_rollback_on_failure: true
        keep_rollback_snapshot: true
        snapshot_retention_days: 30

  self_improver:
    name: "自改进器"
    module: "evolution/self_improver.py"
    config:
      # 学习数据源
      learning_sources:
        - historical_decisions
        - successful_patterns
        - failed_attempts
        - user_feedback
        - community_best_practices
        
      # 学习模式
      learning_modes:
        - reinforcement_learning
        - pattern_recognition
        - case_based_reasoning
        - knowledge_graph_expansion
        
      # 改进领域
      improvement_areas:
        - decision_making_accuracy
        - code_generation_quality
        - test_case_effectiveness
        - documentation_relevance
        - estimation_precision
        
      # 知识库管理
      knowledge_base:
        storage_path: ".universal-devops/knowledge/"
        max_entries: 10000
        retention_policy: "keep_best"
        similarity_threshold: 0.8

# 演化控制器配置
controller:
  module: "evolution/evolution_controller.py"
  
  # 协调策略
  orchestration:
    mode: "sequential"  # sequential | parallel | adaptive
    conflict_resolution: "priority_based"
    
  # 节流控制
  throttling:
    max_evolutions_per_day: 5
    min_interval_between_evolutions: 3600  # 1小时
    cooldown_after_failure: 7200            # 2小时
    
  # 风险控制
  risk_management:
    max_risk_score: 7.0  # 0-10 scale
    require_human_approval_for:
      - risk_score_above: 7.0
      - changes_affecting: ["production", "security", "data"]
      - scope_larger_than: "3_files"
      
  # 审计日志
  audit:
    log_all_decisions: true
    log_all_actions: true
    retention_days: 365
    export_format: ["json", "csv"]

# 触发器配置
triggers:
  scheduled:
    - id: "daily_health_check"
      schedule: "0 3 * * *"
      action: "self_iterator.run_light_check"
      
    - id: "weekly_deep_evolution"
      schedule: "0 2 * * 0"  # 周日凌晨2点
      action: "self_iterator.run_deep_analysis"
      
  event_driven:
    - event: "quality_gate_failure"
      actions:
        - "self_repairer.diagnose_and_suggest"
        - "self_optimizer.identify_root_cause"
        
    - event: "high_bug_density"
      threshold: "bugs_per_kloc > 5"
      actions:
        - "self_repairer.analyze_bug_patterns"
        - "self_improver.learn_from_failures"
        
    - event: "tech_debt_threshold"
      threshold: "tech_debt_hours > 40"
      actions:
        - "self_optimizer.plan_refactoring"
        - "self_iterator.prioritize_debt_reduction"
        
    - event: "performance_regression"
      threshold: "p99_latency_increase > 20%"
      actions:
        - "self_optimizer.investigate_performance"
        - "self_repairer.check_recent_changes"
        
  manual:
    - command: "/evolve"
      description: "触发完整演化周期"
      requires_confirmation: true
      
    - command: "/self-repair"
      description: "触发自修复流程"
      scope: "current_issue"
      
    - command: "/optimize"
      description: "触发自优化"
      targets: ["performance", "resource", "quality"]
      
    - command: "/learn"
      description: "触发学习改进"
      source: "recent_history"

# 演化报告配置
reporting:
  format: "markdown"
  output_dir: "docs/monitoring/evolution_reports"
  include_sections:
    - summary
    - changes_made
    - quality_impact
    - risk_assessment
    - recommendations
  notification:
    on_completion: true
    on_failure: true
    channels: ["console", "file"]
