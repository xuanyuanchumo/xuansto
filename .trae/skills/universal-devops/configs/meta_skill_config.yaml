# 元技能层配置
# ===========

meta_skill:
  evaluation:
    schedule: "weekly"
    metrics:
      - trigger_rate
      - effectiveness_score
      - user_satisfaction
      - file_integrity
    
  optimization:
    auto_optimize: false  # 默认手动触发
    sensitivity: 0.7      # 优化灵敏度(0-1)
    
  extension:
    suggest_new_skills: true
    min_gap_severity: "medium"
    
  packing:
    output_format: "skill"
    include_dependencies: true
    min_version: "5.0.0"
