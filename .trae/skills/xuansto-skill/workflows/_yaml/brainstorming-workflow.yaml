metadata:
  name: 6阶段苏格拉底式需求探索工作流
  version: "3.2.0"
  description: 通过6阶段苏格拉底式对话引导从模糊想法到结构化设计文档
  platform: all
  min_agents: 1
  max_agents: 3
phases:
  - id: phase-1
    name: Discovery
    order: 0
    optional: false
    trigger_condition: 用户输入探索主题
    agents:
      primary: [brainstorming-facilitator]
      supporting: []
    inputs:
      - name: 探索主题
        type: document
        required: true
    outputs:
      - name: 信息缺口清单
        type: document
        validation: 高优先级缺口已全部回答
      - name: Discovery问答记录
        type: document
        validation: 所有问题有对应回答
    quality_gates:
      - gate_id: BRAINSTORM-COMPLETE
        blocking: true
        pass_criteria: 设计文档已生成+用户确认+6阶段全部完成
      - gate_id: discovery_gaps_answered
        blocking: true
        pass_criteria: 高优先级信息缺口已全部回答
    timeout_minutes: 30
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-2
    name: Option Analysis
    order: 1
    optional: false
    trigger_condition: Discovery阶段完成
    agents:
      primary: [brainstorming-facilitator]
      supporting: [product-manager]
    inputs:
      - name: 信息缺口清单
        type: document
        required: true
        source_phase: phase-1
      - name: Discovery问答记录
        type: document
        required: true
        source_phase: phase-1
    outputs:
      - name: 方案对比矩阵
        type: document
        validation: 至少2个方案含Trade-off分析
      - name: 用户选择结果
        type: document
        validation: 用户已选择方案
    quality_gates:
      - gate_id: option_analysis_complete
        blocking: true
        pass_criteria: 至少2个方案+Trade-off对比+用户已选择
    timeout_minutes: 20
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-3
    name: Design Creation
    order: 2
    optional: false
    trigger_condition: Option Analysis阶段完成
    agents:
      primary: [brainstorming-facilitator]
      supporting: [system-architect]
    inputs:
      - name: 用户选择结果
        type: document
        required: true
        source_phase: phase-2
      - name: Discovery问答记录
        type: document
        required: true
        source_phase: phase-1
    outputs:
      - name: 结构化设计文档
        type: document
        validation: 包含8个必要章节+用户已确认
    quality_gates:
      - gate_id: design_document_created
        blocking: true
        pass_criteria: 设计文档包含目标/范围/架构/数据模型/接口/约束/风险/验证标准
    timeout_minutes: 15
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-4
    name: Design Reflection
    order: 3
    optional: false
    trigger_condition: Design Creation阶段完成
    agents:
      primary: [brainstorming-facilitator]
      supporting: []
    inputs:
      - name: 结构化设计文档
        type: document
        required: true
        source_phase: phase-3
    outputs:
      - name: 反思修正记录
        type: document
        validation: 至少3个挑战性问题+遗漏已修正
      - name: 最终设计文档
        type: document
        validation: 用户已确认修正
    quality_gates:
      - gate_id: design_reflected
        blocking: true
        pass_criteria: 至少3个挑战性问题+遗漏已修正+用户已确认
    timeout_minutes: 15
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-5
    name: Git Commit
    order: 4
    optional: false
    trigger_condition: Design Reflection阶段完成
    agents:
      primary: [brainstorming-facilitator]
      supporting: []
    inputs:
      - name: 最终设计文档
        type: document
        required: true
        source_phase: phase-4
    outputs:
      - name: 设计文档文件
        type: document
        validation: 已保存到.agent_cache/<task>/design-document.md
      - name: Git提交记录
        type: document
        validation: 已提交到设计分支
    quality_gates:
      - gate_id: design_committed
        blocking: true
        pass_criteria: 设计文档已保存+已提交到设计分支
    timeout_minutes: 5
    retry:
      max_attempts: 2
      backoff: fixed
  - id: phase-6
    name: Transition
    order: 5
    optional: false
    trigger_condition: Git Commit阶段完成
    agents:
      primary: [brainstorming-facilitator]
      supporting: []
    inputs:
      - name: 最终设计文档
        type: document
        required: true
        source_phase: phase-4
      - name: Git提交记录
        type: document
        required: true
        source_phase: phase-5
    outputs:
      - name: 交接摘要
        type: document
        validation: 包含关键决策+架构注意事项+建议下一步
    quality_gates:
      - gate_id: transition_complete
        blocking: true
        pass_criteria: 交接摘要已生成+包含关键决策和下一步建议
    timeout_minutes: 5
    retry:
      max_attempts: 1
      backoff: fixed
agent_matrix:
  brainstorming-facilitator:
    phases: [phase-1, phase-2, phase-3, phase-4, phase-5, phase-6]
    role: primary
    max_parallel_instances: 1
  product-manager:
    phases: [phase-2]
    role: supporting
    max_parallel_instances: 1
  system-architect:
    phases: [phase-3]
    role: supporting
    max_parallel_instances: 1
exception_handling:
  phase_failure:
    action: retry_then_escalate
    escalation_target: orchestrator
    max_retries: 2
  agent_unavailable:
    action: substitute_and_continue
    substitute_agent: product-manager
  quality_gate_blocked:
    action: pause_and_notify
    auto_fix_agents: [brainstorming-facilitator]
