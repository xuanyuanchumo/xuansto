[pytest]
# 测试文件模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 异步模式
asyncio_mode = auto

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    api: API 测试
    model: 模型测试
    asyncio: 异步测试
    slow: 慢速测试
    security: 安全测试
    owasp: OWASP Top 10 安全测试
    sensitive_data: 敏感数据检测测试

# 覆盖率配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=50

# 忽略目录
norecursedirs = 
    .git
    .venv
    venv
    __pycache__
    .pytest_cache
    htmlcov
    build
    dist

# 环境变量
env =
    TESTING=true
    DATABASE_URL=sqlite:///:memory:
