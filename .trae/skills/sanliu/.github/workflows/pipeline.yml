name: Sanliu Skill CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (only build and deploy)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  test-skillscripts:
    name: Skillscripts Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-html coverage flake8 mypy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run unit tests (skillscripts)
      run: |
        cd skillscripts
        pytest core/test_path_config_center.py core/test_path_config_center_v33.py -v --cov=path_config_center --cov-report=xml --cov-report=html || true
        pytest pipeline/test_sdd_tdd_fusion_engine_v33.py -v --cov=sdd_tdd_fusion_engine --cov-append --cov-report=xml || true
        pytest monitoring/test_quality_monitoring_v33.py -v --cov=quality_metrics_collector --cov-append --cov-report=xml || true
        pytest core/test_evolution_system_v33.py -v --cov-append --cov-report=xml || true

    - name: Upload skillscripts coverage report
      uses: actions/upload-artifact@v4
      with:
        name: skillscripts-coverage-${{ matrix.python-version }}
        path: skillscripts/htmlcov/

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: './backend/requirements*.txt'

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run unit tests with coverage
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: 'True'
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --junitxml=test-results.xml

    - name: Quality gate check
      working-directory: ./backend
      run: |
        COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree=ET.parse('coverage.xml'); root=tree.getroot(); print(float(root.attrib.get('line-rate', 0)) * 100)")
        echo "Coverage: ${COVERAGE}%"
        
        python -c "
        import sys
        coverage = float('${COVERAGE}')
        if coverage < 80:
            print(f'::error::Coverage {coverage:.1f}% is below threshold 80%')
            sys.exit(1)
        print(f'✅ Coverage {coverage:.1f}% meets threshold')
        "

    - name: Generate test report
      working-directory: ./
      run: |
        mkdir -p docs/迭代版本/v3.3.0/
        cd backend
        pytest --html=../docs/迭代版本/v3.3.0/test_report.html --self-contained-html || true

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: ./backend/htmlcov/

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: ./backend/test-results.xml

    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: docs/迭代版本/v3.3.0/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage.xml
        flags: unit
        name: unit-test-coverage
        fail_ci_if_error: false

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements*.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run backend lint (ruff)
        working-directory: ./backend
        run: ruff check . --output-format=github

      - name: Run backend format check (black)
        working-directory: ./backend
        run: black --check .

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements*.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run backend type check (mypy)
        working-directory: ./backend
        run: mypy . --ignore-missing-imports

      - name: Run frontend type check
        working-directory: ./frontend
        run: npm run typecheck

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements*.txt'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integration_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: integration-test-secret-key
          DEBUG: 'True'
        run: |
          pytest tests/ -v -m integration --tb=short

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, integration-tests]
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements*.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start backend server
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: e2e-test-secret-key
          DEBUG: 'True'
          CORS_ORIGINS: 'http://localhost:4173'
        run: |
          python -c "
          from app.database import Base, engine
          Base.metadata.create_all(bind=engine)
          "
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > backend.pid
          sleep 5

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          BASE_URL: http://localhost:4173
          API_URL: http://localhost:8000
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./frontend/playwright-report/
          retention-days: 7

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Run security scan
      run: |
        pip install bandit safety
        mkdir -p security-reports
        
        echo "Running Bandit security scan..."
        bandit -r skillscripts/ -ll --format json > security-reports/bandit-report.json || true
        bandit -r backend/app/ -ll --format json >> security-reports/bandit-report.json || true
        
        echo "Running Safety dependency check..."
        safety check --json > security-reports/safety-report.json || true
        
        echo "Security scan completed"
        
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: security-reports/

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [test-backend, integration-tests]
    if: success() || inputs.skip_tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './backend/requirements*.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist
          retention-days: 7

      - name: Create backend package
        working-directory: ./backend
        run: |
          mkdir -p ../artifacts/backend
          cp -r app ../artifacts/backend/
          cp requirements.txt ../artifacts/backend/
          cp -r ../artifacts/backend ../artifacts/backend-package

      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: ./artifacts/backend-package
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist

      - name: Download backend package
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: ./backend/app

      - name: Deploy to staging
        id: deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          cat >> ~/.ssh/config << EOF
          Host staging-server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF
          
          echo "Deploying to staging environment..."
          echo "url=https://staging.example.com" >> $GITHUB_OUTPUT

      - name: Notify deployment
        run: |
          echo "✅ Staging deployment completed!"
          echo "Environment: staging"
          echo "Commit: ${{ github.sha }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, e2e-tests]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist

      - name: Download backend package
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: ./backend/app

      - name: Deploy to production
        id: deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          cat >> ~/.ssh/config << EOF
          Host production-server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF
          
          echo "Deploying to production environment..."
          echo "url=https://production.example.com" >> $GITHUB_OUTPUT

      - name: Notify deployment
        run: |
          echo "✅ Production deployment completed!"
          echo "Environment: production"
          echo "Commit: ${{ github.sha }}"

  report:
    name: Generate Pipeline Report
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-backend, test-skillscripts, integration-tests, e2e-tests, build, security-scan]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
        continue-on-error: true

      - name: Generate pipeline report
        run: |
          python -c "
          import json
          from datetime import datetime
          
          report = {
              'timestamp': datetime.now().isoformat(),
              'run_id': '${{ github.run_id }}',
              'run_number': '${{ github.run_number }}',
              'ref': '${{ github.ref }}',
              'sha': '${{ github.sha }}',
              'event': '${{ github.event_name }}',
              'jobs': {
                  'lint': '${{ needs.lint.result }}',
                  'type_check': '${{ needs.type-check.result }}',
                  'unit_tests': '${{ needs.test-backend.result }}',
                  'skillscripts_tests': '${{ needs.test-skillscripts.result }}',
                  'integration_tests': '${{ needs.integration-tests.result }}',
                  'e2e_tests': '${{ needs.e2e-tests.result }}',
                  'security_scan': '${{ needs.security-scan.result }}',
                  'build': '${{ needs.build.result }}'
              }
          }
          
          with open('pipeline_report.json', 'w') as f:
              json.dump(report, f, indent=2)
          "

      - name: Upload pipeline report
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: pipeline_report.json
          retention-days: 30

      - name: Pipeline Summary
        run: |
          echo "## Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skillscripts Tests | ${{ needs.test-skillscripts.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
