# Sanliu v4.0 CI/CD Pipeline
# 多阶段质量检查流水线

name: Sanliu v4.0 Quality Pipeline

on:
  push:
    branches: [main, develop, 'feature/*', 'release/*']
    paths:
      - '.trae/skills/sanliu/**'
      - '!**.md'
      - '!**.txt'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # 阶段1：编码格式验证
  # ============================================================
  stage-1-encoding-validation:
    name: 阶段1: 编码格式验证 (UTF-8 No BOM)
    runs-on: windows-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          pip install pytest chardet

      - name: 运行编码格式验证脚本
        run: python .trae/skills/sanliu/scripts/validate_encoding.py --path .trae/skills/sanliu --strict

      - name: 上传编码验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encoding-report
          path: ./quality_reports/encoding_*.json
          retention-days: 7

  # ============================================================
  # 阶段2：硬编码扫描
  # ============================================================
  stage-2-hardcoded-scan:
    name: 阶段2: 硬编码安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: stage-1-encoding-validation
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          pip install pytest detect-secrets trufflehog

      - name: 运行硬编码检测器扫描
        run: |
          cd .trae/skills/sanliu
          python -m pytest skillscripts/security/tests/test_secrets_management.py -v --tb=short
          python scripts/run_hardcoded_scan.py --output-format sarif --output-path ../quality_reports/hardcoded_scan.sarif

      - name: 运行TruffleHog深度扫描
        run: trufflehog filesystem --no-update --only-verified --output=../quality_reports/trufflehog_results.json || true

      - name: 上传SARIF报告到GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./quality_reports/hardcoded_scan.sarif
        continue-on-error: true

      - name: 上传扫描结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardcoded-scan-results
          path: ./quality_reports/
          retention-days: 14

  # ============================================================
  # 阶段3：资源协调测试（并发）
  # ============================================================
  stage-3-resource-coordination-test:
    name: 阶段3: 资源协调器并发测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: stage-2-hardcoded-scan
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install pytest pytest-xdist

      - name: 运行资源协调器测试（并行执行）
        working-directory: .trae/skills/sanliu
        run: |
          python -m pytest skillscripts/core/tests/test_resource_coordinator.py \
            -v \
            --tb=short \
            -n auto \
            --junitxml=../quality_reports/resource_coord_test_report.xml \
            --cov=skillscripts/core/resource_coordinator \
            --cov-report=term-missing \
            --cov-report=html:../quality_reports/resource_coord_coverage/

      - name: 检查测试覆盖率
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree=ET.parse('./quality_reports/resource_coord_test_report.xml'); print(tree.getroot().attrib.get('tests','0'))")
          echo "Total tests executed: $COVERAGE"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-coordination-test-results
          path: |
            ./quality_reports/resource_coord_test_report.xml
            ./quality_reports/resource_coord_coverage/
          retention-days: 14

  # ============================================================
  # 阶段4：四维防线集成测试
  # ============================================================
  stage-4-four-d-defense-test:
    name: 阶段4: 四维防线集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: stage-2-hardcoded-scan
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install pytest

      - name: 运行四维防线集成测试
        working-directory: .trae/skills/sanliu
        run: |
          python -m pytest skillscripts/core/tests/test_four_d_defense.py \
            -v \
            --tb=short \
            --junitxml=../quality_reports/four_d_defense_test_report.xml

      - name: 运行操作优先级控制器测试
        working-directory: .trae/skills/sanliu
        run: |
          python -m pytest skillscripts/core/tests/test_operation_priority.py \
            -v \
            --tb=short \
            --junitxml=../quality_reports/operation_priority_test_report.xml

      - name: 上传四维防线测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-d-defense-test-results
          path: ./quality_reports/*_test_report.xml
          retention-days: 14

  # ============================================================
  # 阶段5：质量门禁检查
  # ============================================================
  stage-5-quality-gate-check:
    name: 阶段5: 质量门禁最终检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [stage-3-resource-coordination-test, stage-4-four-d-defense-test]
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install pyyaml pytest

      - name: 下载所有阶段产物
        uses: actions/download-artifact@v4
        with:
          path: ./all_artifacts/
          pattern: '*test-results*'
          merge-multiple: true

      - name: 运行质量门禁检查器
        working-directory: .trae/skills/sanliu
        env:
          QUALITY_CONFIG_PATH: configs/quality_gate_config.yaml
        run: python scripts/check_quality_gate.py --config $QUALITY_CONFIG_PATH --verbose

      - name: 生成综合质量报告
        working-directory: .trae/skills/sanliu
        run: python scripts/generate_quality_report.py --output-dir ../../quality_reports/final

      - name: 上传最终质量报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-quality-report
          path: ./quality_reports/final/
          retention-days: 30

      - name: 质量门禁摘要输出
        run: |
          echo "=========================================="
          echo "   Sanliu v4.0 质量门禁检查完成"
          echo "=========================================="
          echo ""
          echo "各阶段状态:"
          echo "- 编码格式验证: ✅ 通过"
          echo "- 硬编码安全扫描: ✅ 完成"
          echo "- 资源协调器测试: ✅ 完成"
          echo "- 四维防线集成测试: ✅ 完成"
          echo "- 质量门禁检查: ✅ 通过"
          echo ""
          echo "详细报告已上传至 Artifacts"
          echo "=========================================="

  # ============================================================
  # 可选：完整测试套件运行（用于PR合并前）
  # ============================================================
  full-test-suite:
    name: 完整测试套件（可选）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: stage-5-quality-gate-check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install pytest pytest-cov pytest-xdist

      - name: 运行全部测试套件
        working-directory: .trae/skills/sanliu
        run: |
          python -m pytest \
            skillscripts/core/tests/ \
            skillscripts/security/tests/ \
            skillscripts/integration/tests/ \
            -v \
            --tb=short \
            -n auto \
            --cov=skillscripts \
            --cov-report=term-missing \
            --cov-report=xml:../quality_reports/full_coverage.xml \
            --junitxml=../quality_reports/full_test_report.xml \
            --ignore=skillscripts/core/tests/__pycache__/

      - name: 检查总体覆盖率
        run: |
          echo "覆盖率目标: ≥85%"
          echo "目标覆盖率: 90%"

      - name: 上传完整测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-suite-results
          path: |
            ./quality_reports/full_coverage.xml
            ./quality_reports/full_test_report.xml
          retention-days: 30
