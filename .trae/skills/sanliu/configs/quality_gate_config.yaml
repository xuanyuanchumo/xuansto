# Sanliu v4.0 质量门禁配置
# Quality Gate Configuration for Sanliu v4.0

version: "4.0"
project: sanliu
description: "Sanliu v4.0 多维度质量门禁配置"

# 全局质量阈值
global_thresholds:
  # 测试覆盖率
  test_coverage:
    minimum: 85%
    target: 90%
    critical: true
  
  # 代码质量评分
  code_quality_score:
    minimum: 7.5
    target: 8.5
    scale: 10

# 四维防线质量门禁
four_d_defense:
  enabled: true
  layers:
    prompt_layer:
      pass_rate:
        minimum: 95%
        target: 98%
      confidence_threshold: 0.75
    
    capability_layer:
      skill_match_rate:
        minimum: 90%
        target: 95%
      knowledge_coverage:
        minimum: 85%
        target: 92%
    
    rule_validation_layer:
      security_scan:
        critical_issues: 0
        high_issues_max: 2
        medium_issues_max: 5
      lint_pass_rate:
        minimum: 95%
        target: 99%
      hardcoded_detection:
        allowed_patterns: []
    
    fallback_recovery_layer:
      quality_score_minimum: 0.6
      rollback_readiness: required

  overall_pass_rate:
    minimum: 95%
    target: 98%

# 资源协调器健康度
resource_coordinator:
  enabled: true
  health_metrics:
    lock_contention_rate:
      warning: 15%
      critical: 30%
    deadlock_recovery_success_rate:
      minimum: 99%
    queue_wait_time_avg_ms:
      warning: 500
      critical: 2000
    
  quota_utilization:
    per_agent_warning: 80%
    per_agent_critical: 95%
    global_warning: 85%
    global_critical: 98%

  health_score:
    minimum: 90%
    target: 95%

# 安全扫描质量门禁
security_scan:
  enabled: true
  severity_thresholds:
    critical:
      max_count: 0
      block_merge: true
    high:
      max_count: 2
      block_merge: false
      require_review: true
    medium:
      max_count: 10
      require_comment: true
    low:
      max_count: 20
      informational_only: true

  scan_types:
    - secret_detection
    - dependency_vulnerability
    - code_injection
    - hard_coded_credentials
    - insecure_randomness

  secrets_management:
    validate_on_commit: true
    mask_in_logs: true
    audit_trail: true

# 编码格式验证
encoding_format:
  enabled: true
  requirements:
    utf8_no_bom:
      compliance_rate: 100%
      enforce: true
      file_extensions:
        - .py
        - .js
        - .ts
        - .jsx
        - .tsx
        - .yaml
        - .yml
        - .json
        - .md
        - .sh
        - .ps1
        - .css
        - .html
        - .vue
        - .svelte
    
    line_endings:
      preferred: LF
      allow_CRLF_for_extensions:
        - .bat
        - .cmd
        - .ps1

    trailing_whitespace:
      trim: true
      ignore_blank_lines: true

    max_line_length:
      python: 120
      javascript: 120
      markdown: 120
      yaml: 120

# 操作优先级决策准确率
operation_priority:
  enabled: true
  accuracy_metrics:
    decision_accuracy:
      minimum: 90%
      target: 95%
    risk_assessment_accuracy:
      minimum: 88%
      target: 93%
    preflight_block_rate:
      false_positive_max: 5%
  
  coverage_requirements:
    manual_priority_cases: covered
    script_priority_cases: covered
    command_priority_cases: covered
    dangerous_command_patterns: all_21_covered

# 测试套件要求
test_suites:
  operation_priority:
    min_test_cases: 15
    coverage_target: 90%
  
  four_d_defense:
    min_test_cases: 20
    coverage_target: 85%
  
  resource_coordinator:
    min_test_cases: 25
    concurrency_tests_required: true
    coverage_target: 85%
  
  secrets_management:
    min_test_cases: 30
    security_tests_required: true
    coverage_target: 90%
  
  agency_bridge:
    min_test_cases: 15
    integration_tests_required: true
    coverage_target: 80%
  
  platform_adapter:
    min_test_cases: 15
    cross_platform_tests_required: true
    coverage_target: 85%
  
  ux_integration:
    min_test_cases: 10
    ui_validation_tests_required: true
    coverage_target: 75%
  
  decision_log:
    min_test_cases: 10
    export_format_tests_required: true
    coverage_target: 80%

# CI/CD 阶段配置
pipeline_stages:
  stage_1_encoding_check:
    name: 编码格式验证
    description: 验证所有文件使用 UTF-8 No BOM 编码
    tools:
      - encoding_validator
    fail_fast: false
  
  stage_2_hardcoded_scan:
    name: 硬编码扫描
    description: 检测代码中的硬编码密钥和敏感信息
    tools:
      - hardcoded_detector
      - trufflehog
    fail_on_critical: true
  
  stage_3_resource_coordination_test:
    name: 资源协调测试
    description: 运行资源协调器的并发和安全测试
    tools:
      - pytest (test_resource_coordinator.py)
    timeout_minutes: 10
  
  stage_4_four_d_defense_test:
    name: 四维防线集成测试
    description: 运行四维度输出防线的完整集成测试
    tools:
      - pytest (test_four_d_defense.py)
    timeout_minutes: 5
  
  stage_5_quality_gate_check:
    name: 质量门禁检查
    description: 根据本配置文件执行最终质量评估
    tools:
      - quality_gate_checker
    generate_report: true

# 告警机制
alerts:
  channels:
    - console
    - log_file
    - # webhook (可配置)

  severity_levels:
    info:
      color: "\U0001f7e2"  # 绿色圆圈
      action: log_only
    warning:
      color: "\U0001f7e1"  # 黄色圆圈
      action: log_and_notify
    error:
      color: "\U0001f534"  # 红色圆圈
      action: block_and_notify
    critical:
      color: "\U0001f534\U0001f534"  # 双红色圆圈
      action: immediate_block

# 报告输出
reporting:
  format:
    - console_summary
    - detailed_json
    - markdown_report
  
  output_directory: ./quality_reports
  retain_history: 10

# 例外规则（谨慎使用）
exceptions:
  legacy_code:
    enabled: false
    paths: []
    relaxed_rules: []

  third_party:
    enabled: true
    paths:
      - node_modules/
      - vendor/
      - __pycache__/
      - .git/
    skip_checks:
      - encoding_format
      - test_coverage
      - security_scan

# 版本兼容性
compatibility:
  supported_versions:
    - "4.0"
  deprecated_features: []
  migration_notes: ""
